apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: 114403655423.dkr.ecr.ap-south-1.amazonaws.com/employee-frontend:latest
          ports:
            - containerPort: 80
