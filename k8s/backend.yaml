apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: 114403655423.dkr.ecr.ap-south-1.amazonaws.com/employee-backend:latest
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: backend-config
